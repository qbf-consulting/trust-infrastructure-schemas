title: Trust Infrastructure Schemas
description: Portable machine-readable trust contracts for authority, delegation, evidence, decisions, registries, and assurance.
url: https://qbf-consulting.github.io
baseurl: /trust-infrastructure-schemas
remote_theme: just-the-docs/just-the-docs@v0.10.1
markdown: kramdown
strict_front_matter: true
search_enabled: true
heading_anchors: true
color_scheme: light
aux_links:
  "View on GitHub":
    - "https://github.com/qbf-consulting/trust-infrastructure-schemas"
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Publication contract: every canonical documentation page is rendered through
# the Just-the-Docs default layout. Individual pages retain only navigation and
# content metadata; styling is enforced centrally so a new docs page cannot be
# published as bare HTML merely because its author omitted a layout field.
defaults:
  - scope:
      path: "docs"
    values:
      layout: default

exclude:
  - node_modules/
  - vendor/
  - tools/
  - scripts/
  - tests/
  - validation/
  - artifacts/
  - .github/
  - Gemfile
  - Gemfile.lock
  - CHANGELOG.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - GOVERNANCE.md
  - README.md
  - RELEASE_NOTES_v0.11.0.md
  - RELEASE_NOTES_v0.12.0.md
  - ROADMAP.md
  - SECURITY.md
  - SUPPORT.md
  - STEWARDSHIP.md
  - assurance/assurance-levels.md
  - conformance/IMPLEMENTER-DECLARATION.md
  - controls/controls.md
  - credentials/agent/v1/README.md
  - credentials/dtg/v1/README.md
  - credentials/reputation/v1/README.md
  - decision/README.md
  - delegation/README.md
  - examples/cross-repo/runtime-assurance-v0.10/README.md
  - odrl/README.md
  - profiles/ais1/README.md
  - registry/README.md
  - upstream/dtg-credentials.md
  - upstream/openvtc.md
  - upstream/verifiable-trust-infrastructure.md

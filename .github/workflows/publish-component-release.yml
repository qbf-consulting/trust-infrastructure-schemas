name: Publish TIS Component Release

on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'docs/releases/v0.15.0.md'
      - '.github/workflows/publish-component-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tis-v0.15.0
  cancel-in-progress: false

env:
  VERSION: '0.15.0'
  TAG: 'v0.15.0'
  RELEASE_TITLE: 'TIS v0.15.0 — Portable Assurance Lifecycle, Conformance and Action-Specific Authority'
  RELEASE_NOTES: 'docs/releases/v0.15.0.md'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release source and candidate gate
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "$VERSION"
          test -s "$RELEASE_NOTES"
          npm run candidate:check
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --latest
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$RELEASE_TITLE" --notes-file "$RELEASE_NOTES" --latest
          fi
          gh release view "$TAG" --json url,tagName,name,targetCommitish,isDraft,isPrerelease,isLatest
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')" = "false"
          test "$(gh release view "$TAG" --json isLatest --jq '.isLatest')" = "true"
